name: Check links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA (actions/checkout v4.2.2) so the action can't change underneath us.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check relative links and anchors in Markdown
        run: python3 scripts/check_links.py .
