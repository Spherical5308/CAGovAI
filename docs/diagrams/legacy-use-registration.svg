<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 330" width="932" height="330" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title>Legacy Use registration (first 90 days)</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="932" height="330" fill="#FFFFFF"/>
<polyline points="151.0,165.0 181.0,165.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<polyline points="301.0,165.0 331.0,165.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<polyline points="241.0,139.0 241.0,55.0 331.0,55.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<polyline points="451.0,165.0 483.0,165.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<polyline points="541.0,202.0 541.0,249.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="546.0" y="216.0" font-size="10.5" fill="#333" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">Yes</text>
<polyline points="599.0,165.0 631.0,165.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="603.0" y="160.0" font-size="10.5" fill="#333" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">No</text>
<polyline points="751.0,165.0 781.0,165.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="31.0" y="139.0" width="120" height="52" rx="26.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="91.0" y="168.5">Policy adopted</tspan>
</text>
<rect x="181.0" y="139.0" width="120" height="52" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="241.0" y="156.0">90-day</tspan>
<tspan x="241.0" y="168.5">registration</tspan>
<tspan x="241.0" y="181.0">window opens</tspan>
</text>
<rect x="331.0" y="24.0" width="120" height="62.0" rx="6" fill="#F8CECC" stroke="#B85450" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="391.0" y="39.8">After 90 days:</tspan>
<tspan x="391.0" y="52.2">unregistered AI is</tspan>
<tspan x="391.0" y="64.8">a security</tspan>
<tspan x="391.0" y="77.2">incident</tspan>
</text>
<rect x="331.0" y="127.75" width="120" height="74.5" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="391.0" y="143.5">Units and IT</tspan>
<tspan x="391.0" y="156.0">register all AI in</tspan>
<tspan x="391.0" y="168.5">use, incl.</tspan>
<tspan x="391.0" y="181.0">vendor-added SaaS</tspan>
<tspan x="391.0" y="193.5">features</tspan>
</text>
<polygon points="541.0,128.0 599.0,165.0 541.0,202.0 483.0,165.0" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="541.0" y="162.2">Prohibited</tspan>
<tspan x="541.0" y="174.8">use?</tspan>
</text>
<rect x="481.0" y="249.0" width="120" height="52" rx="6" fill="#F8CECC" stroke="#B85450" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="541.0" y="278.5">Stop the use</tspan>
</text>
<rect x="631.0" y="139.0" width="120" height="52" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="691.0" y="162.2">Flag as Legacy</tspan>
<tspan x="691.0" y="174.8">Use; keep running</tspan>
</text>
<rect x="781.0" y="134.0" width="120" height="62.0" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.3"/>
<text text-anchor="middle" font-size="10.5" fill="#111">
<tspan x="841.0" y="149.8">Normal triage and</tspan>
<tspan x="841.0" y="162.2">Assessment</tspan>
<tspan x="841.0" y="174.8">Package, High</tspan>
<tspan x="841.0" y="187.2">first</tspan>
</text>
</svg>
